<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>預算明細</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/budget-panel.css">
</head>
<body class="budget-panel-page">
  <main id="budgetPanel" class="budget-panel" aria-live="polite">
    <header class="budget-panel-header"><div><div class="eyebrow">PROJECT FINANCE</div><h1 id="panelTitle">預算明細</h1></div><button id="refreshBudgetPanel" type="button" class="secondary">重新整理</button></header>
    <div id="panelError" class="note warn" role="alert" hidden></div>
    <section class="budget-panel-filters" aria-label="預算明細篩選">
      <label>經費類別<select id="filterSource"><option value="">請選擇經費類別</option></select></label>
      <label>經費屬性<select id="filterCategory" disabled><option value="">請選擇經費屬性</option></select></label>
      <label>搜尋科目<input id="filterSubject" type="search" placeholder="輸入科目名稱"></label>
      <div class="panel-updated">最後更新：<time id="updatedAt">尚未載入</time></div>
    </section>
    <section class="budget-compare" aria-label="流出與流入預算比較">
      <div class="budget-compare-scroll" id="budgetCompareScroll">
        <table class="table budget-compare-table">
          <colgroup>
            <col class="subject-column">
            <col span="10" class="metric-column">
          </colgroup>
          <thead>
            <tr><th class="subject-sticky" rowspan="2" scope="col">預算科目</th><th class="group-heading out-group out-start" colspan="5">流出：<select id="fromOwner" aria-label="選擇流出單位"><option value="">請選擇單位</option></select></th><th class="group-heading in-group in-start" colspan="5">流入：<select id="toOwner" aria-label="選擇流入單位"><option value="">請選擇單位</option></select></th></tr>
            <tr><th class="out-start" scope="col">規劃流出</th><th scope="col">規劃流入</th><th scope="col">可用餘額</th><th scope="col">規劃後餘額</th><th class="status-heading" scope="col">狀態</th><th class="in-start" scope="col">規劃流出</th><th scope="col">規劃流入</th><th scope="col">可用餘額</th><th scope="col">規劃後餘額</th><th class="status-heading" scope="col">狀態</th></tr>
          </thead>
          <tbody id="budgetRows"><tr><td colspan="11" class="empty">請先選擇專案條件</td></tr></tbody>
        </table>
      </div>
      <ul class="hint budget-panel-notes">
        <li><strong>規劃流出：</strong>系統已先保留（即圈存）的金額，不能核銷或另做流用。</li>
        <li><strong>規劃流入：</strong>尚未轉入，不能先流出。</li>
        <li><strong>可用餘額：</strong>目前流出上限以此為準。</li>
        <li><strong>規劃後餘額：</strong>可用餘額加規劃流入；負數表示規劃完成後仍需補足。</li>
        <li><strong>「—」：</strong>表示該單位沒有這筆預算明細。</li>
        <li><strong>編輯既有流用：</strong>本次可流出上限以流用表單提示為準。</li>
      </ul>
    </section>
  </main>
  <script src="/budget-panel.js"></script>
</body>
</html>
