<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{EMAIL_TITLE}}</title>
  <style>
    /* 可修改：信件底色、字型、寬度與主文字顏色。 */
    body { margin: 0; padding: 24px 12px; background: #f4f1ec; color: #1f2937; font-family: Arial, "Microsoft JhengHei", sans-serif; }
    .email-card { max-width: 760px; margin: 0 auto; padding: 24px; background: #ffffff; border: 1px solid #e8e2d8; border-radius: 12px; }
    /* 可修改：標題色彩、大小與分隔線。 */
    h1 { margin: 0 0 8px; color: #1f2937; font-size: 22px; }
    .subhead { margin: 0 0 20px; color: #4b5563; }
    /* 可修改：表格標題列與表格框線樣式。 */
    table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; }
    th, td { padding: 9px 10px; border: 1px solid #d7dce2; text-align: left; }
    th { background: #f4f1ec; }
    td:last-child { text-align: right; }
    .footer { margin-top: 24px; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <main class="email-card">
    <!-- 可修改：信件主標題文字與排版。不要刪除 {{EMAIL_TITLE}} 變數。 -->
    <h1>{{EMAIL_TITLE}}</h1>
    <!-- 可修改：專案名稱、編號與資料截止日的顯示方式。請保留下列變數。 -->
    <p class="subhead">{{PROJECT_NAME}}（{{PROJECT_CODE}}）｜資料截至 {{REPORT_DATE}}</p>
    <!-- 系統會在此處放入收件人有權查看的摘要表格；請保留 {{SUMMARY_CONTENT}}。 -->
    {{SUMMARY_CONTENT}}
    <!-- 可修改：信件結尾文字。 -->
    <p class="footer">此信由專案經費管理系統寄出。如有疑問，請聯絡專案助理。</p>
  </main>
</body>
</html>
